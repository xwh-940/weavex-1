name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[debug,test]"
      - run: python -m pytest -q
      - run: python scripts/verify_evidence.py
      - run: python examples/answer_refresh.py --arm relevant
      - run: python examples/answer_refresh.py --arm irrelevant
      - run: python -m ruff check scripts examples/answer_refresh.py tests/test_showcase.py
