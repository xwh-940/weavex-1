[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weavex-prototype"
version = "0.0.0"
description = "Question-driven semantic world and Actor inquiry prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
debug = ["fastapi", "openai", "uvicorn"]
test = ["httpx", "pytest", "pytest-asyncio", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weavex = ["debug/*"]
"weavex.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
